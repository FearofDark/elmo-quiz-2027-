<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elmo Quiz - Kamera-Stream</title>
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #000; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
        video { width: 100%; max-width: 400px; height: auto; border-radius: 8px; border: 2px solid #4f46e5; }
        .status { margin-top: 15px; font-size: 18px; color: #22c55e; }
    </style>
</head>
<body>
    <h3>Dein Kamera-Stream</h3>
    <div id="local-preview"></div>
    <div class="status" id="status-text">Verbinde Kamera...</div>

    <script>
        const LIVEKIT_URL = 'wss://elmo-quiz.duckdns.org';
        const urlParams = new URLSearchParams(window.location.search);
        const roomName = urlParams.get('room') || 'quiz-raum';
        const participantName = urlParams.get('name') || 'Handy-Cam-' + Math.floor(Math.random() * 100);

        async function startCamera() {
            try {
                const res = await fetch(`https://elmoquiz2027.vercel.app/api/token?room=${roomName}&name=${participantName}`);
                const data = await res.json();

                const room = new LivekitClient.Room({ websocketTransport: true });
                await room.connect(LIVEKIT_URL, data.token);

                // Direkt Kamera und Mikrofon aktivieren und senden
                await room.localParticipant.enableCameraAndMicrophone();

                const localPub = room.localParticipant.getTrackPublication(LivekitClient.Track.Source.Camera);
                if (localPub && localPub.videoTrack) {
                    const previewContainer = document.getElementById('local-preview');
                    const element = localPub.videoTrack.attach();
                    previewContainer.appendChild(element);
                }

                document.getElementById('status-text').innerText = 'Live verbunden! Kamera aktiv.';
            } catch (err) {
                document.getElementById('status-text').innerText = 'Fehler: ' + err.message;
                document.getElementById('status-text').style.color = '#ef4444';
            }
        }

        // Direkt beim Laden der Seite starten
        window.addEventListener('load', startCamera);
    </script>
</body>
</html>
