<script>
        const LIVEKIT_URL = 'wss://elmo-quiz.duckdns.org';
        const roomName = 'quiz-raum';

        document.getElementById('start-btn').addEventListener('click', async () => {
            const name = document.getElementById('player-name-input').value.trim();
            if (!name) return alert('Bitte gib deinen Namen ein!');

            document.getElementById('login-box').style.display = 'none';
            document.getElementById('stream-box').style.display = 'flex';
            document.getElementById('status-text').innerText = `Hole Token und verbinde als "${name}"...`;

            try {
                // 1. Token von Vercel abrufen
                const res = await fetch(`https://elmoquiz2027.vercel.app/api/token?room=${roomName}&name=${encodeURIComponent(name)}`);
                if (!res.ok) throw new Error(`Vercel API antwortete mit Status ${res.status}`);
                const data = await res.json();

                // 2. LiveKit Raum initialisieren
                const room = new LivekitClient.Room({
                    adaptiveStream: true,
                    dynacast: true
                });

                document.getElementById('status-text').innerText = `Verbinde mit Hetzner Server...`;

                // 3. WICHTIG: ERST mit dem Raum verbinden, BEVOR Tracks publiziert werden!
                await room.connect(LIVEKIT_URL, data.token);

                document.getElementById('status-text').innerText = `Verbunden! Aktiviere Kamera...`;

                // 4. JETZT Kamera und Mikrofon freigeben und senden
                await room.localParticipant.enableCameraAndMicrophone();

                // 5. Eigenes Video in der Vorschau anzeigen
                const localTrackPub = Array.from(room.localParticipant.videoTracks.values())[0];
                if (localTrackPub && localTrackPub.track) {
                    localTrackPub.track.attach(document.getElementById('preview-video'));
                }

                document.getElementById('status-text').innerText = `Erfolgreich live im Raum!`;

            } catch (err) {
                console.error(err);
                document.getElementById('status-text').innerText = `Fehler: ${err.message}`;
                // Fallback: Bei Fehler zurück zum Login
                setTimeout(() => {
                    document.getElementById('login-box').style.display = 'block';
                    document.getElementById('stream-box').style.display = 'none';
                }, 4000);
            }
        });
    </script>
