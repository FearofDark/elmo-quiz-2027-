<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Quizmaster - Multi-Dashboard</title>
    <script src="config.js"></script>
    <style>
        body { font-family: sans-serif; background: #222; color: #fff; text-align: center; padding: 20px; }
        .grid { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 30px; }
        .card { background: #1a1a1a; border: 2px solid #00bcd4; border-radius: 8px; padding: 15px; width: 360px; }
        video { width: 100%; height: 240px; background: #000; border-radius: 4px; }
        .status { margin-top: 10px; font-weight: bold; color: #ff9800; font-size: 14px; }
    </style>
</head>
<body>
    <h2>Quizmaster - Live-Stream Überwachung</h2>
    
    <div class="grid">
        <!-- Spieler 1 -->
        <div class="card">
            <h3>Spieler 1</h3>
            <video id="video-spieler1" autoplay playsinline muted></video>
            <div id="status-spieler1" class="status">Warte auf Sender...</div>
        </div>

        <!-- Spieler 2 -->
        <div class="card">
            <h3>Spieler 2</h3>
            <video id="video-spieler2" autoplay playsinline muted></video>
            <div id="status-spieler2" class="status">Warte auf Sender...</div>
        </div>
    </div>

    <script>
        // Universelle Funktion zum Empfangen eines beliebigen Spieler-Streams
        async function startReceiving(playerId, videoId, statusId) {
            const videoEl = document.getElementById(videoId);
            const statusEl = document.getElementById(statusId);
            
            const pc = new RTCPeerConnection();
            pc.addTransceiver('video', { direction: 'recvonly' });
            pc.addTransceiver('audio', { direction: 'recvonly' });

            pc.ontrack = (event) => {
                videoEl.srcObject = event.streams[0];
                statusEl.style.color = "#4CAF50";
                statusEl.innerText = "Status: Live verbunden";
            };

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            try {
                const response = await fetch(CONFIG.getWhepUrl(playerId), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/sdp' },
                    body: offer.sdp
                });

                if (!response.ok) throw new Error("Offline");

                const answerSdp = await response.text();
                await pc.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: answerSdp }));
            } catch (err) {
                statusEl.style.color = "#ff9800";
                statusEl.innerText = "Warte auf Sender...";
                // Automatischer Reconnect-Versuch alle 3 Sekunden
                setTimeout(() => startReceiving(playerId, videoId, statusId), 3000);
            }
        }

        // Starte den Empfang für Spieler 1 und Spieler 2 gleichzeitig
        startReceiving('spieler1', 'video-spieler1', 'status-spieler1');
        startReceiving('spieler2', 'video-spieler2', 'status-spieler2');
    </script>
</body>
</html>
