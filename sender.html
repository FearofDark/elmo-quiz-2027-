<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Quiz - Live Sender</title>
    <script src="config.js"></script>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; text-align: center; padding-top: 30px; }
        video { width: 480px; height: 360px; background: #000; border: 2px solid #444; border-radius: 8px; }
        .status { margin-top: 15px; font-weight: bold; color: #ff9800; font-size: 18px; }
        .player-badge { background: #00bcd4; color: #000; display: inline-block; padding: 5px 15px; border-radius: 20px; font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>
    <h2>Dein Live-Kamera-Sender</h2>
    <div id="playerBadge" class="player-badge">Lade Profil...</div>
    <br>
    <video id="localVideo" autoplay playsinline muted></video>
    <div id="status" class="status">Verbinde mit Server...</div>

    <script>
        // Spieler-ID aus URL auslesen (Standard ist 'spieler1', wenn nichts dranhängt)
        const urlParams = new URLSearchParams(window.location.search);
        const playerId = urlParams.get('player') || 'spieler1';
        document.getElementById('playerBadge').innerText = `Profil: ${playerId.toUpperCase()}`;

        async function startPublishing() {
            const statusEl = document.getElementById('status');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 360 }, audio: true });
                document.getElementById('localVideo').srcObject = stream;

                const pc = new RTCPeerConnection();
                stream.getTracks().forEach(track => pc.addTrack(track, stream));

                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                // Holt die URL passend zur Spieler-ID aus der config.js
                const response = await fetch(CONFIG.getWhipUrl(playerId), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/sdp' },
                    body: offer.sdp
                });

                if (!response.ok) throw new Error("Server hat den Stream abgelehnt");

                const answerSdp = await response.text();
                await pc.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: answerSdp }));

                statusEl.style.color = "#4CAF50";
                statusEl.innerText = "Status: LIVE zum Server verbunden!";
            } catch (err) {
                console.error(err);
                statusEl.style.color = "#f44336";
                statusEl.innerText = "Fehler: " + err.message;
            }
        }

        startPublishing();
    </script>
</body>
</html>
