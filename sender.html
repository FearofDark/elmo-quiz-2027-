<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Quiz - Kamera Sender</title>
    <!-- Zentraler Config-Aufruf -->
    <script src="config.js"></script>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; text-align: center; padding-top: 40px; }
        video { width: 400px; height: 300px; background: #000; border: 2px solid #444; border-radius: 8px; }
        .status { margin-top: 15px; font-weight: bold; color: #ff9800; font-size: 18px; }
    </style>
</head>
<body>
    <h2>Dein Live-Kamera-Sender</h2>
    <video id="localVideo" autoplay playsinline muted></video>
    <div id="status" class="status">Verbinde mit Server...</div>

    <script>
        async function startPublishing() {
            const statusEl = document.getElementById('status');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 360 }, audio: true });
                document.getElementById('localVideo').srcObject = stream;

                const pc = new RTCPeerConnection();
                stream.getTracks().forEach(track => pc.addTrack(track, stream));

                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                // Holt die URL automatisch aus der config.js
                const response = await fetch(CONFIG.whipUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/sdp' },
                    body: offer.sdp
                });

                if (!response.ok) throw new Error("Server hat den Stream abgelehnt");

                const answerSdp = await response.text();
                await pc.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: answerSdp }));

                statusEl.style.color = "#4CAF50";
                statusEl.innerText = "Status: LIVE zum Server verbunden!";
            } catch (err) {
                console.error(err);
                statusEl.style.color = "#f44336";
                statusEl.innerText = "Fehler: " + err.message;
            }
        }

        startPublishing();
    </script>
</body>
</html>
