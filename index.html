<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2-Player Quiz Kameras</title>
    <!-- LiveKit Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #18181b; color: #fff; text-align: center; margin: 0; padding: 20px; }
        .grid { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 30px; }
        .player-card { background: #27272a; padding: 15px; border-radius: 12px; border: 1px solid #3f3f46; }
        video { width: 360px; height: 270px; background: #000; border-radius: 8px; object-fit: cover; }
        button { padding: 12px 24px; font-size: 16px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>

    <h1>Quiz Kameras (Hetzner LiveKit)</h1>
    <button id="join-btn">Kamera starten & Raum beitreten</button>

    <div class="grid">
        <div class="player-card">
            <h3>Deine Kamera</h3>
            <div id="local-video"></div>
        </div>
        <div class="player-card">
            <h3>Gegenspieler</h3>
            <div id="remote-video"></div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
