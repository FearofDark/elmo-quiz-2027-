<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Quiz - Spieler Login & Studio</title>
    <script src="config.js"></script>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; text-align: center; margin: 0; padding: 20px; }
        .hidden { display: none !important; }
        
        /* Login Box */
        #login-screen { max-width: 400px; margin: 100px auto; background: #1a1a1a; padding: 30px; border-radius: 10px; border: 2px solid #00bcd4; }
        input { padding: 10px; font-size: 16px; width: 80%; margin-bottom: 15px; border-radius: 5px; border: none; text-align: center; }
        button { padding: 10px 20px; font-size: 16px; background: #00bcd4; color: #000; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #008ba3; }

        /* Studio Screen (Nach Login) */
        #studio-screen { max-width: 1200px; margin: 0 auto; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: #1a1a1a; padding: 10px 20px; border-radius: 8px; margin-bottom: 20px; }
        
        /* Grid für alle Spieler */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }
        .player-card { background: #1a1a1a; border: 2px solid #333; border-radius: 8px; padding: 10px; text-align: center; position: relative; }
        .player-card.is-me { border-color: #00bcd4; }
        video { width: 100%; height: 180px; background: #000; border-radius: 4px; object-fit: cover; }
        .player-name { font-weight: bold; margin-bottom: 5px; color: #fff; }
        .status { font-size: 12px; color: #ff9800; }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-screen">
        <h2>Quiz-Anmeldung</h2>
        <p>Gib deinen Spielernamen ein, um dem Studio beizutreten:</p>
        <input type="text" id="usernameInput" placeholder="z.B. anna oder spieler1" autocomplete="off">
        <br>
        <button onclick="joinQuiz()">Dem Quiz beitreten</button>
    </div>

    <!-- STUDIO / GRID SCREEN -->
    <div id="studio-screen" class="hidden">
        <div class="top-bar">
            <h2>Dein Studio (<span id="displayName"></span>)</h2>
            <div id="connectionStatus" style="color: #ff9800; font-weight: bold;">Verbinde Kamera...</div>
        </div>

        <!-- 8er Grid für alle Spieler -->
        <div class="grid-container" id="playerGrid">
            <!-- Wird dynamisch gefüllt -->
        </div>
    </div>

    <script>
        let myPlayerId = "";
        // Liste aller Spieler, die im Quiz mitmachen (kannst du beliebig erweitern bis zu 8)
        const allPossiblePlayers = ["spieler1", "spieler2", "spieler3", "spieler4", "spieler5", "spieler6", "spieler7", "spieler8"];

        function joinQuiz() {
            const input = document.getElementById('usernameInput').value.trim().toLowerCase();
            if (!input) {
                alert("Bitte gib einen gültigen Namen ein!");
                return;
            }
            myPlayerId = input;
            
            // UI umschalten
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('studio-screen').classList.remove('hidden');
            document.getElementById('displayName').innerText = myPlayerId.toUpperCase();

            // Grid aufbauen und Streams starten
            initGrid();
            startPublishing();
        }

        // Baut das 8er Grid im HTML auf
        function initGrid() {
            const grid = document.getElementById('playerGrid');
            grid.innerHTML = "";

            allPossiblePlayers.forEach(pId => {
                const isMe = (pId === myPlayerId);
                const card = document.createElement('div');
                card.className = `player-card ${isMe ? 'is-me' : ''}`;
                card.innerHTML = `
                    <div class="player-name">${pId.toUpperCase()} ${isMe ? '(Du)' : ''}</div>
                    <video id="vid-${pId}" autoplay playsinline ${isMe ? 'muted' : ''}></video>
                    <div class="status" id="stat-${pId}">Warte...</div>
                `;
                grid.appendChild(card);

                // Wenn es ICH bin, speisen wir gleich den lokalen Stream ein. 
                // Alle anderen empfangen wir per WHEP!
                if (!isMe) {
                    startReceiving(pId, `vid-${pId}`, `stat-${pId}`);
                }
            });
        }

        // 1. Eigene Kamera senden (WHIP)
        async function startPublishing() {
            const statusEl = document.getElementById('connectionStatus');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 360 }, audio: true });
                
                // Eigenes Video direkt in die "Eigene Karte" packen
                const myVideo = document.getElementById(`vid-${myPlayerId}`);
                myVideo.srcObject = stream;
                document.getElementById(`stat-${myPlayerId}`).innerText = "Live aktiv";
                document.getElementById(`stat-${myPlayerId}`).style.color = "#4CAF50";

                const pc = new RTCPeerConnection();
                stream.getTracks().forEach(track => pc.addTrack(track, stream));

                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                const response = await fetch(CONFIG.getWhipUrl(myPlayerId), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/sdp' },
                    body: offer.sdp
                });

                if (!response.ok) throw new Error("Server hat Stream abgelehnt");

                const answerSdp = await response.text();
                await pc.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: answerSdp }));

                statusEl.style.color = "#4CAF50";
                statusEl.innerText = "Status: Kamera erfolgreich übertragen!";
            } catch (err) {
                console.error(err);
                statusEl.style.color = "#f44336";
                statusEl.innerText = "Kamera-Fehler: " + err.message;
            }
        }

        // 2. Alle anderen Spieler empfangen (WHEP)
        async function startReceiving(playerId, videoId, statusId) {
            const videoEl = document.getElementById(videoId);
            const statusEl = document.getElementById(statusId);
            
            const pc = new RTCPeerConnection();
            pc.addTransceiver('video', { direction: 'recvonly' });
            pc.addTransceiver('audio', { direction: 'recvonly' });

            pc.ontrack = (event) => {
                videoEl.srcObject = event.streams[0];
                statusEl.style.color = "#4CAF50";
                statusEl.innerText = "Verbunden";
            };

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            try {
                const response = await fetch(CONFIG.getWhepUrl(playerId), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/sdp' },
                    body: offer.sdp
                });

                if (!response.ok) throw new Error("Offline");

                const answerSdp = await response.text();
                await pc.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: answerSdp }));
            } catch (err) {
                statusEl.style.color = "#777";
                statusEl.innerText = "Offline / Wartet...";
                // Alle 4 Sekunden versuchen, ob der Spieler online kommt
                setTimeout(() => startReceiving(playerId, videoId, statusId), 4000);
            }
        }
    </script>
</body>
</html>
