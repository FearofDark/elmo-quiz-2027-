<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Quiz - Spieler Studio</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Config -->
    <script src="config.js"></script>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; text-align: center; margin: 0; padding: 20px; }
        .hidden { display: none !important; }
        
        #slot-screen { max-width: 450px; margin: 80px auto; background: #1a1a1a; padding: 30px; border-radius: 10px; border: 2px solid #00bcd4; }
        .slot-btn { display: block; width: 100%; padding: 12px; margin: 10px 0; font-size: 16px; background: #333; color: #fff; border: 1px solid #555; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .slot-btn:hover { background: #00bcd4; color: #000; }

        #studio-screen { max-width: 1200px; margin: 0 auto; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: #1a1a1a; padding: 10px 20px; border-radius: 8px; margin-bottom: 20px; }
        
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }
        .player-card { background: #1a1a1a; border: 2px solid #333; border-radius: 8px; padding: 10px; text-align: center; }
        .player-card.is-me { border-color: #00bcd4; }
        video { width: 100%; height: 180px; background: #000; border-radius: 4px; object-fit: cover; }
        .player-name { font-weight: bold; margin-bottom: 5px; color: #fff; }
        .status { font-size: 12px; color: #ff9800; }
        .reset-link { margin-top: 15px; display: inline-block; color: #aaa; cursor: pointer; font-size: 14px; text-decoration: underline; }
    </style>
</head>
<body>

    <!-- SLOT AUSWAHL SCREEN -->
    <div id="slot-screen">
        <h2>Wähle deinen Spieler-Slot</h2>
        <p>Klicke auf den Slot, den du belegen möchtest:</p>
        <div id="slotButtonsContainer"></div>
    </div>

    <!-- STUDIO / GRID SCREEN -->
    <div id="studio-screen" class="hidden">
        <div class="top-bar">
            <h2>Dein Studio (<span id="displayName"></span>)</h2>
            <div id="connectionStatus" style="color: #ff9800; font-weight: bold;">Verbinde Kamera...</div>
        </div>

        <div class="grid-container" id="playerGrid"></div>
        <br>
        <span class="reset-link" onclick="resetSlot()">Slot wechseln / Zurücksetzen</span>
    </div>

    <!-- Logik-Datei -->
    <script src="index.js"></script>
</body>
</html>
