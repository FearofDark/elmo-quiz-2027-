<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2-Player Quiz & Kameras</title>
    
    <!-- LiveKit Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
    
    <!-- QR-Code Bibliothek für die Handy-Verbindung -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        #quiz-container {
            text-align: center;
            background: #222;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .video-grid {
            display: flex;
            gap: 20px;
            margin: 20px 0;
            justify-content: center;
        }
        .video-box {
            width: 320px;
            height: 240px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #444;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .video-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #4338ca;
        }
        #mobile-cam-box {
            margin-top: 20px;
            border-top: 1px solid #444;
            padding-top: 15px;
        }
        #qrcode {
            display: inline-block;
            background: white;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div id="quiz-container">
        <h1>Elmo Quiz Duell</h1>
        <button id="join-btn">Dem Spiel beitreten</button>

        <!-- Video-Anzeige für lokal & gegnerisch -->
        <div class="video-grid">
            <div class="video-box" id="local-video"><span>Eigene Kamera</span></div>
            <div class="video-box" id="remote-video"><span>Gegner</span></div>
        </div>

        <!-- QR-Code Bereich für das Smartphone (falls keine Webcam am PC) -->
        <div id="mobile-cam-box">
            <p style="font-size: 14px; color: #aaa;">Keine Webcam am PC? Scanne den Code mit dem Handy:</p>
            <div id="qrcode"></div>
        </div>
    </div>

    <!-- Deine JavaScript-Logik -->
    <script src="index.js"></script>
</body>
</html>
