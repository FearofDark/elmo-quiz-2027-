<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>WebRTC Minimal-Test</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; text-align: center; padding: 20px; }
        .container { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 20px; }
        .box { background: #222; padding: 15px; border-radius: 8px; border: 1px solid #444; width: 320px; }
        video { width: 100%; height: 200px; background: #000; border-radius: 4px; object-fit: cover; }
        button { padding: 12px 20px; font-size: 16px; background: #00bcd4; color: #000; border: none; border-radius: 5px; cursor: pointer; margin: 5px; font-weight: bold; }
        button:hover { background: #008ba3; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <h1>WebRTC Minimal-Test</h1>
    
    <div id="setup-screen">
        <p>Wähle, als was du dieses Gerät testen möchtest:</p>
        <button onclick="startTest('cam1')">Als Cam 1 starten (z.B. PC)</button>
        <button onclick="startTest('cam2')">Als Cam 2 starten (z.B. Handy)</button>
    </div>

    <div id="test-screen" class="hidden">
        <h2 id="roleTitle"></h2>
        <div class="container">
            <div class="box">
                <h3>Deine Kamera (Senden)</h3>
                <video id="localVideo" autoplay playsinline muted></video>
                <p id="localStatus">Verbinde WHIP...</p>
            </div>
            <div class="box">
                <h3>Andere Kamera (Empfangen)</h3>
                <video id="remoteVideo" autoplay playsinline></video>
                <p id="remoteStatus">Warte auf Gegenstelle...</p>
            </div>
        </div>
        <br><br>
        <button onclick="location.reload()">Neustarten / Rolle wechseln</button>
    </div>

<script src="index.js"></script>
</body>
</html>
