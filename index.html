<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elmo Quiz - Kamera Übersicht</title>
    <!-- LiveKit Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #fff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 { margin-bottom: 10px; }
        #connect-btn {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        #connect-btn:hover { background: #4338ca; }
        
        /* Responsives Grid für bis zu 20 Kameras */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .cam-card {
            background: #1e293b;
            border-radius: 8px;
            padding: 10px;
            border: 1px solid #334155;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .cam-card h3 {
            font-size: 14px;
            margin: 0 0 8px 0;
            color: #cbd5e1;
        }
        .video-container {
            width: 100%;
            height: 180px;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <h1>Elmo Quiz - Live Kameras</h1>
    <button id="connect-btn">Kamera-Übersicht starten</button>

    <!-- Das Grid, in dem sich die Kameras automatisch einreihen -->
    <div class="video-grid" id="video-grid"></div>

    <!-- JavaScript Logik einbinden -->
    <script src="index.js"></script>
</body>
</html>
