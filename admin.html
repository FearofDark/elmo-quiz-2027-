<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Quizmaster - Admin Zentrale</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Config -->
    <script src="config.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 30px; max-width: 900px; margin: 0 auto; }
        h1 { color: #00bcd4; text-align: center; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #aaa; margin-bottom: 30px; }
        
        .slot-table { width: 100%; border-collapse: collapse; background: #1e1e1e; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .slot-table th, .slot-table td { padding: 15px; text-align: left; border-bottom: 1px solid #333; }
        .slot-table th { background: #252525; color: #00bcd4; }
        
        input[type="text"] { padding: 8px 12px; font-size: 14px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px; width: 200px; }
        input[type="text"]:focus { border-color: #00bcd4; outline: none; }
        
        .badge { display: inline-block; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 12px; }
        .badge.offline { background: #333; color: #aaa; }
        .badge.online { background: #4CAF50; color: #000; }
        
        button { padding: 8px 15px; background: #00bcd4; color: #000; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #008ba3; }
    </style>
</head>
<body>

    <h1>Quizmaster Admin-Zentrale</h1>
    <p class="subtitle">Verwalte hier zentral die Spielernamen über Supabase.</p>

    <table class="slot-table">
        <thead>
            <tr>
                <th>System-Slot</th>
                <th>Spielername / Team</th>
                <th>Status</th>
                <th>Aktion</th>
            </tr>
        </thead>
        <tbody id="adminTableBody"></tbody>
    </table>

    <!-- Admin Logik-Datei -->
    <script src="admin.js"></script>
</body>
</html>
