<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiz Kamera Stream</title>
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
    <style>
        :root { --bg: #090d16; --panel: #111827; --blue: #3b82f6; --green: #22c55e; --red: #ef4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background: var(--bg); color: #fff; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px; }
        
        .container { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 500px; }
        video { width: 100%; height: auto; max-height: 70vh; border-radius: 12px; background: #000; border: 2px solid var(--blue); transform: scaleX(-1); object-fit: cover; }
        .status { margin-top: 15px; color: #9ca3af; font-size: 14px; text-align: center; }
        .slot-title { font-size: 1.2rem; font-weight: bold; color: var(--blue); margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="slot-title" id="slot-display">Kamera wird initialisiert...</div>
        <video id="local-video" autoplay playsinline muted></video>
        <p class="status" id="status-text">Verbinde mit Hetzner Server...</p>
    </div>

    <script>
        const LIVEKIT_URL = 'wss://elmo-quiz.duckdns.org';
        const urlParams = new URLSearchParams(window.location.search);
        const roomName = urlParams.get('room') || 'quiz-raum';
        const playerName = urlParams.get('name') || 'player1';

        document.getElementById('slot-display').innerText = `Slot-ID: ${playerName}`;

        async function initCamera() {
            const statusText = document.getElementById('status-text');
            try {
                // Token von Vercel holen
                const res = await fetch(`https://elmoquiz2027.vercel.app/api/token?room=${roomName}&name=${encodeURIComponent(playerName)}`);
                if (!res.ok) throw new Error(`Vercel API Status ${res.status}`);
                const data = await res.json();

                const room = new LivekitClient.Room({ adaptiveStream: true, dynacast: true });

                // Erst verbinden, dann Kamera aktivieren
                await room.connect(LIVEKIT_URL, data.token);
                await room.localParticipant.enableCameraAndMicrophone();

                // Eigenes Video anzeigen
                const tracks = Array.from(room.localParticipant.videoTracks.values());
                if (tracks.length > 0 && tracks[0].track) {
                    tracks[0].track.attach(document.getElementById('local-video'));
                }

                statusText.style.color = 'var(--green)';
                statusText.innerText = `🟢 Live als "${playerName}" verbunden!`;

            } catch (err) {
                console.error(err);
                statusText.style.color = 'var(--red)';
                statusText.innerText = `Fehler: ${err.message}`;
            }
        }

        window.addEventListener('load', initCamera);
    </script>
</body>
</html>
