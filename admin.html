<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Quizmaster - Admin Überwachung</title>
    <script src="config.js"></script>
    <style>
        body { font-family: sans-serif; background: #181818; color: #fff; text-align: center; margin: 0; padding: 20px; }
        h1 { color: #00bcd4; margin-bottom: 5px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 30px; }
        .card { background: #222; border: 2px solid #444; border-radius: 8px; padding: 15px; }
        .card.active { border-color: #4CAF50; }
        video { width: 100%; height: 200px; background: #000; border-radius: 4px; object-fit: cover; }
        .status { margin-top: 8px; font-weight: bold; color: #ff9800; font-size: 14px; }
    </style>
</head>
<body>
    <h1>Quizmaster Admin-Dashboard</h1>
    <p>Live-Überwachung aller 8 Spieler-Slots</p>

    <div class="grid" id="adminGrid"></div>

    <script>
        const slots = ["spieler1", "spieler2", "spieler3", "spieler4", "spieler5", "spieler6", "spieler7", "spieler8"];
        const grid = document.getElementById('adminGrid');

        slots.forEach(slotId => {
            const card = document.createElement('div');
            card.className = "card";
            card.id = `card-${slotId}`;
            card.innerHTML = `
                <h3>${slotId.toUpperCase()}</h3>
                <video id="vid-${slotId}" autoplay playsinline muted></video>
                <div class="status" id="stat-${slotId}">Warte auf Stream...</div>
            `;
            grid.appendChild(card);

            subscribePlayer(slotId, `vid-${slotId}`, `stat-${slotId}`, `card-${slotId}`);
        });

        async function subscribePlayer(slotId, videoId, statusId, cardId) {
            const videoEl = document.getElementById(videoId);
            const statusEl = document.getElementById(statusId);
            const cardEl = document.getElementById(cardId);
            
            const pc = new RTCPeerConnection();
            pc.addTransceiver('video', { direction: 'recvonly' });
            pc.addTransceiver('audio', { direction: 'recvonly' });

            pc.ontrack = (event) => {
                videoEl.srcObject = event.streams[0];
                statusEl.style.color = "#4CAF50";
                statusEl.innerText = "LIVE übertragen";
                cardEl.classList.add('active');
            };

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            try {
                const response = await fetch(CONFIG.getWhepUrl(slotId), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/sdp' },
                    body: offer.sdp
                });

                if (!response.ok) throw new Error("Offline");

                const answerSdp = await response.text();
                await pc.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: answerSdp }));
            } catch (err) {
                statusEl.style.color = "#ff9800";
                statusEl.innerText = "Wartet auf Signal...";
                cardEl.classList.remove('active');
                
                setTimeout(() => subscribePlayer(slotId, videoId, statusId, cardId), 3000);
            }
        }
    </script>
</body>
</html>
